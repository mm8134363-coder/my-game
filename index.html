<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>صوتنا | دردشة صوتية</title><link rel="stylesheet" href="app.css"></head>
<body>
<header><b>🎙️ صوتنا</b><span id="status">غير متصل</span></header>
<main>
<section id="login" class="card"><h1>دردشة صوتية وترفيه</h1><p>اختر اسمك ثم ادخل غرفة.</p><input id="name" placeholder="اسمك"><button onclick="start()">دخول</button></section>
<section id="app" hidden>
<div class="rooms card"><h2>الغرف</h2><div id="rooms"></div></div>
<div class="chat card"><h2 id="roomTitle">اختر غرفة</h2><div id="messages"></div><div class="send"><input id="msg" placeholder="اكتب رسالة"><button onclick="sendChat()">إرسال</button></div><button class="mic" id="mic" onclick="toggleMic()">🎤 تشغيل الميكروفون</button><button class="danger" onclick="report()">🚨 بلاغ</button></div>
</section>
</main><script src="app.js"></script></body></html>
