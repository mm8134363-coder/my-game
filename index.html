<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>جامع العملات</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header>
      <h1>🪙 جامع العملات</h1>
      <div class="stats">
        <span>النقاط: <b id="score">0</b></span>
        <span>الوقت: <b id="time">30</b></span>
      </div>
    </header>

    <section id="arena" class="arena" aria-label="منطقة اللعب">
      <div id="message" class="message">اضغط ابدأ للعب</div>
    </section>

    <button id="startBtn" class="start">ابدأ اللعبة</button>
    <p class="hint">اضغط على 🪙 بأسرع ما يمكن قبل انتهاء الوقت.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
